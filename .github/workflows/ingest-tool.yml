name: Import owner-submitted tools
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  import:
    if: >-
      startsWith(github.event.issue.title, 'Add tool: ') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: node scripts/ingest.mjs
      - name: Commit updated catalog
        run: |
          if ! git diff --quiet -- catalog/tools.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog/tools.json
            git commit -m "catalog: import resource from owner issue"
            git push origin HEAD:main
          fi
